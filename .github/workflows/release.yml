name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# softprops/action-gh-release creates a release, which needs write access. The
# default token is read-only, and without this the job dies with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  windows:
    name: windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # No signing certificate is configured, so the bundles are unsigned. That
      # is stated in the release notes rather than hidden: an unsigned installer
      # shows a SmartScreen warning and the user deserves to know why.
      - name: build installers
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      # Attach to the GitHub release, creating it as a pre-release when the tag
      # has no release yet. Unsigned, and the notes say so.
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          body: |
            VN Asyik ${{ github.ref_name }} — pre-release.

            Installers are **unsigned**, so Windows SmartScreen will warn and
            Android will ask you to allow installation from an unknown source.

            Known limitations: chapter detection is window-title only, no in-app
            game hooking, and the Android APK is debug-signed unless the
            `ANDROID_KEY_*` secrets are configured.
          files: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  android:
    name: android (apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships an SDK; setup-android@v3 rejects it with
      # "Wrong version in preinstalled sdkmanager" and then fails while accepting
      # licences. Pointing at the existing install is enough, and the NDK version
      # below is the one this project builds against.
      - name: locate the preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: install NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # Release keystore. `secrets` cannot appear in a job-level `if:` (GitHub
      # rejects the whole workflow with zero jobs), so the emptiness check runs
      # in a step that always executes. Without the secret the APK is built but
      # unsigned: it installs, yet cannot replace a properly signed install.
      - name: decode keystore
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "keystore decoded"
          else
            echo "::warning::ANDROID_KEY_BASE64 is not set; the APK will be unsigned"
          fi

      - name: build apk
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NDK_BIN: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          if [ -n "$ANDROID_KEY_BASE64" ]; then
            export ANDROID_KEY_STORE_PATH="$RUNNER_TEMP/release.keystore"
            export ANDROID_KEY_STORE_PASSWORD="$ANDROID_KEY_PASSWORD"
            export ANDROID_KEY_ALIAS="$ANDROID_KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          fi
          # No --split-per-abi: one universal APK that installs on any ABI.
          pnpm tauri android build --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: false
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
