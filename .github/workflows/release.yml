name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# softprops/action-gh-release creates a release, which needs write access. The
# default token is read-only, and without this the job dies with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Owns the release so the two build jobs cannot race on creating it. Both of
  # them only attach files, via gh release upload.
  create-release:
    name: create release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - name: create the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VN Asyik $GITHUB_REF_NAME" \
            --prerelease \
            --notes "Pre-release. Installers are unsigned: Windows SmartScreen will warn, and Android will ask you to allow installation from an unknown source. Known limitations: chapter detection is window-title only, and there is no in-app game hooking."

  windows:
    needs: create-release
    name: windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # No signing certificate is configured, so the bundles are unsigned. That
      # is stated in the release notes rather than hidden: an unsigned installer
      # shows a SmartScreen warning and the user deserves to know why.
      - name: build installers
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      # Attach to the GitHub release, creating it as a pre-release when the tag
      # has no release yet. Unsigned, and the notes say so.
      # Only one job may create the release: both run concurrently on a tag and
      # the second would fail with "already_exists". Android owns creation and
      # the notes; this job waits for it and only attaches files.
      - name: wait for the release to exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release exists"
              exit 0
            fi
            echo "waiting for the release ($attempt/60)"
            sleep 10
          done
          echo "::error::the release was never created"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload only. softprops/action-gh-release updates release metadata here,
      # and doing that from the second job collides with the first on tag_name,
      # which rolls back the files it just attached. `gh release upload` has no
      # such side effect, and the release itself is created by the Android job.
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The bundle names contain a space ("VN Asyik_0.1.0_x64_en-US.msi").
          # An unquoted glob word-splits on it, so gh silently receives two
          # bogus arguments and uploads nothing while still exiting 0.
          shopt -s nullglob
          files=(
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers found to upload"
            ls -R target/release/bundle || true
            exit 1
          fi
          for f in "${files[@]}"; do echo "uploading $f"; done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: create-release
    name: android (apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships an SDK; setup-android@v3 rejects it with
      # "Wrong version in preinstalled sdkmanager" and then fails while accepting
      # licences. Pointing at the existing install is enough, and the NDK version
      # below is the one this project builds against.
      - name: locate the preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: install NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # Release keystore. Tauri v2 does not read signing values from the
      # environment; the documented path is a keystore.properties file that
      # app/build.gradle.kts loads. Without ANDROID_KEY_BASE64 the build still
      # succeeds, signed with the debug key, so a fork can build without secrets.
      - name: write keystore.properties
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::warning::ANDROID_KEY_BASE64 is not set; the APK will be debug-signed"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$KS"
          # Gradle resolves storeFile against src-tauri/gen/android, so an
          # absolute path is the only form that is correct from here.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KS
          password=${ANDROID_KEY_STORE_PASSWORD:-$ANDROID_KEY_PASSWORD}
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "keystore.properties written for alias $ANDROID_KEY_ALIAS"

      - name: build apk
        env:
          NDK_BIN: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: |
          # No --split-per-abi: one universal APK that installs on any ABI.
          pnpm tauri android build --apk --target aarch64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      # Upload only, like the Windows job. Creating the release here made the
      # two jobs race on tag_name; the `create-release` job owns that instead.
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob globstar
          files=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no APK found"
            exit 1
          fi
          for f in "${files[@]}"; do echo "uploading $f"; done
          gh release upload "$GITHUB_REF_NAME" "${files[@]}"             --clobber --repo "$GITHUB_REPOSITORY"
