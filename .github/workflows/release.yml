name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true
        type: string
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# softprops/action-gh-release creates a release, which needs write access. The
# default token is read-only, and without this the job dies with
# "Resource not accessible by integration".
permissions:
  contents: write

jobs:
  # Owns the release so the two build jobs cannot race on creating it. Both of
  # them only attach files, via gh release upload.
  create-release:
    name: create release
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    steps:
      - uses: actions/checkout@v4
      - name: create the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          RELEASE_NOTES: |
            ## What's new

            - Reading-status badges are easier to read over covers. The Script
              card keeps import controls visible and puts extra help in
              **Format and settings**.
            - Fixed **Ctrl+K** for quick commands, including from text fields,
              and fixed **Add a game** closing with the command palette.
            - **Shift+S** takes a screenshot while the tracked game is focused
              on Windows. The game still receives the key combination.
            - Library filtering retains matching covers and shares image-colour
              extraction, with a bounded cache and proper bitmap cleanup.
            - VN Chat has clearer script-summary status, improved Markdown,
              safer source links and spoiler-aware library search. Provider
              streaming, retry, cancellation and error handling were corrected.
            - Fixed companion overlay navigation, memory-edit handling and
              selected-window vision state. These features remain in Beta.
            - Refined desktop startup choices, taste recommendations, character
              details, keyboard access and narrow layouts.
            - Shortened the English and Indonesian READMEs into a practical
              download and feature guide.

            ## Downloads

            - **Windows:** use the `.exe` or `.msi` installer. These builds are unsigned;
              Windows SmartScreen may display a warning.
            - **Android:** use `app-universal-release.apk`. The official build uses the
              existing release signing key and package `com.atho.vnasyik`.
            - **Linux (Beta):** use the `.AppImage`. Make it executable and run it.

            ## Notes

            - New script imports accept VNTP JSON arrays with `name` and
              `message` fields. Previously imported documents remain stored.
            - Linux is Beta. Tracking supports X11 and XWayland; native Wayland
              windows cannot be tracked.
            - Android screenshots require the system screen-casting permission, and
              capture the whole screen rather than one window.
            - Companion remains experimental and further development is paused.
            - The implementation passed 704 frontend tests, lint, typecheck,
              frontend build, Rust Clippy/workspace tests and the Android
              ARM64 compile check. Final desktop UI checks covered light/Nord
              themes and narrow layouts. Full suites were not repeated during
              release preparation; no performance benchmark is claimed.
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists"
            exit 0
          fi
          # Release metadata lives here; README is the only published documentation.
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "VN Asyik $TAG" \
            --prerelease \
            --verify-tag --latest=false \
            --notes-file "${{ runner.temp }}/notes.md"

  windows:
    needs: create-release
    name: windows (msi + nsis)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # Windows has no code-signing certificate, so these bundles are unsigned
      # and SmartScreen will warn. The release notes above say so; the
      # Android APK, by contrast, is signed with the release keystore.
      - name: build installers
        run: pnpm tauri build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          if-no-files-found: error
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

      # The release is created once by the create-release job. This waits for it
      # and only attaches files, because a second creator would collide on
      # tag_name.
      - name: wait for the release to exist
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release exists"
              exit 0
            fi
            echo "waiting for the release ($attempt/60)"
            sleep 10
          done
          echo "::error::the release was never created"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload only. softprops/action-gh-release updates release metadata here,
      # and doing that from the second job collides with the first on tag_name,
      # which rolls back the files it just attached. `gh release upload` has no
      # such side effect, and the release itself is created by the Android job.
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          # The bundle names contain a space ("VN Asyik_0.1.0_x64_en-US.msi").
          # An unquoted glob word-splits on it, so gh silently receives two
          # bogus arguments and uploads nothing while still exiting 0.
          shopt -s nullglob
          files=(
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers found to upload"
            ls -R target/release/bundle || true
            exit 1
          fi
          for f in "${files[@]}"; do echo "uploading $f"; done
          gh release upload "$TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

  # AppImage builds against glibc 2.35 so the bundle also runs on Ubuntu 22.04,
  # which is why this is 22.04 rather than the 24.04 the CI job uses.
  linux:
    name: linux appimage
    needs: create-release
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4

      - name: install linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential curl wget file patchelf \
            libfuse2 xvfb dbus-x11

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: release-linux-ubuntu-22.04

      - run: pnpm install --frozen-lockfile

      - name: build the appimage
        run: pnpm tauri build --ci --bundles appimage -- --locked

      - name: start it on a virtual display
        shell: bash
        run: |
          shopt -s nullglob
          files=(target/release/bundle/appimage/*.AppImage)
          if [ ${#files[@]} -ne 1 ]; then
            echo "::error::expected exactly one AppImage"
            exit 1
          fi
          appimage="${files[0]}"
          chmod +x "$appimage"
          # A bundle that cannot start is not a release asset. The app is given
          # 20 seconds on a virtual display and must still be running.
          xvfb-run -a "$appimage" --appimage-extract-and-run &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the appimage exited during the startup check"
            exit 1
          fi
          kill "$pid" 2>/dev/null || true

      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob
          files=(target/release/bundle/appimage/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no AppImage found to upload"
            ls -R target/release/bundle || true
            exit 1
          fi
          for f in "${files[@]}"; do echo "uploading $f"; done
          gh release upload "$TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"

  android:
    needs: create-release
    name: android (apk)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The version comes from package.json's "packageManager" field. Passing
      # `version:` here as well makes the action refuse to run with
      # "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The runner image already ships an SDK; setup-android@v3 rejects it with
      # "Wrong version in preinstalled sdkmanager" and then fails while accepting
      # licences. Pointing at the existing install is enough, and the NDK version
      # below is the one this project builds against.
      - name: locate the preinstalled Android SDK
        run: |
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: install NDK
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.3.13750724"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - run: pnpm install --frozen-lockfile

      # Release keystore. Tauri v2 does not read signing values from the
      # environment; the documented path is a keystore.properties file that
      # app/build.gradle.kts loads. Without ANDROID_KEY_BASE64 the build still
      # succeeds, signed with the debug key, so a fork can build without secrets.
      - name: write keystore.properties
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ]; then
            echo "::warning::ANDROID_KEY_BASE64 is not set; the APK will be debug-signed"
            exit 0
          fi
          KS="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$KS"
          # Gradle resolves storeFile against src-tauri/gen/android, so an
          # absolute path is the only form that is correct from here.
          cat > src-tauri/gen/android/keystore.properties <<EOF
          storeFile=$KS
          password=${ANDROID_KEY_STORE_PASSWORD:-$ANDROID_KEY_PASSWORD}
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
          echo "keystore.properties written for alias $ANDROID_KEY_ALIAS"

      - name: build apk
        env:
          NDK_BIN: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin
          CC_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          AR_aarch64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
          CC_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          AR_armv7_linux_androideabi: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi24-clang
          CC_x86_64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
          AR_x86_64_linux_android: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER: ${{ env.NDK_HOME }}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android24-clang
        run: |
          # Universal APK with 64-bit ARM, 32-bit ARM, and 64-bit x86
          pnpm tauri android build --apk --target aarch64 armv7 x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          if-no-files-found: error
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk

      # Upload only, like the Windows job. Creating the release here made the
      # two jobs race on tag_name; the `create-release` job owns that instead.
      - name: publish to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          shopt -s nullglob globstar
          files=(src-tauri/gen/android/app/build/outputs/apk/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no APK found"
            exit 1
          fi
          for f in "${files[@]}"; do echo "uploading $f"; done
          gh release upload "$TAG" "${files[@]}" \
            --clobber --repo "$GITHUB_REPOSITORY"
